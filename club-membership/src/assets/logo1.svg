<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 背景径向渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="45%" fy="45%">
      <stop offset="0%" stop-color="#0B1A3A"/>
      <stop offset="100%" stop-color="#1B3B6B"/>
    </radialGradient>

    <!-- 光点渐变 - 炽焰橙 -->
    <radialGradient id="dotOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </radialGradient>

    <!-- 光点渐变 - 耀阳黄 -->
    <radialGradient id="dotYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </radialGradient>

    <!-- 光点渐变 - 暖白 -->
    <radialGradient id="dotWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E0"/>
    </radialGradient>

    <!-- 发光滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- ===== 光点群 - 星火燎原螺旋 ===== -->
  <!-- 外层散落光点（暖白，小，高透明度） - 燎原之势 -->
  <circle cx="680" cy="120" r="3" fill="url(#dotWhite)" opacity="0.4"/>
  <circle cx="750" cy="200" r="2" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="710" cy="380" r="4" fill="url(#dotWhite)" opacity="0.35"/>
  <circle cx="760" cy="480" r="2.5" fill="url(#dotWhite)" opacity="0.25"/>
  <circle cx="620" cy="520" r="3.5" fill="url(#dotWhite)" opacity="0.4"/>
  <circle cx="500" cy="550" r="2" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="350" cy="530" r="3" fill="url(#dotWhite)" opacity="0.35"/>
  <circle cx="200" cy="500" r="2.5" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="100" cy="450" r="4" fill="url(#dotWhite)" opacity="0.25"/>
  <circle cx="50" cy="350" r="3" fill="url(#dotWhite)" opacity="0.2"/>
  <circle cx="120" cy="250" r="2" fill="url(#dotWhite)" opacity="0.35"/>
  <circle cx="80" cy="150" r="3" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="700" cy="280" r="2" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="650" cy="460" r="3" fill="url(#dotWhite)" opacity="0.25"/>
  <circle cx="550" cy="500" r="2" fill="url(#dotWhite)" opacity="0.35"/>
  <circle cx="150" cy="400" r="3.5" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="450" cy="100" r="2.5" fill="url(#dotWhite)" opacity="0.25"/>
  <circle cx="300" cy="80" r="3" fill="url(#dotWhite)" opacity="0.2"/>
  <circle cx="180" cy="130" r="2" fill="url(#dotWhite)" opacity="0.3"/>
  <circle cx="580" cy="80" r="3" fill="url(#dotWhite)" opacity="0.35"/>

  <!-- 中层光点（橙黄混合，中等大小） -->
  <circle cx="620" cy="180" r="6" fill="url(#dotYellow)" opacity="0.6"/>
  <circle cx="580" cy="140" r="5" fill="url(#dotOrange)" opacity="0.55"/>
  <circle cx="660" cy="250" r="7" fill="url(#dotYellow)" opacity="0.5"/>
  <circle cx="640" cy="320" r="5.5" fill="url(#dotOrange)" opacity="0.6"/>
  <circle cx="550" cy="380" r="6" fill="url(#dotYellow)" opacity="0.55"/>
  <circle cx="480" cy="420" r="7" fill="url(#dotOrange)" opacity="0.5"/>
  <circle cx="400" cy="460" r="5" fill="url(#dotYellow)" opacity="0.6"/>
  <circle cx="300" cy="430" r="6.5" fill="url(#dotOrange)" opacity="0.55"/>
  <circle cx="220" cy="380" r="5" fill="url(#dotYellow)" opacity="0.5"/>
  <circle cx="160" cy="320" r="7" fill="url(#dotOrange)" opacity="0.6"/>
  <circle cx="140" cy="250" r="6" fill="url(#dotYellow)" opacity="0.55"/>
  <circle cx="180" cy="190" r="5.5" fill="url(#dotOrange)" opacity="0.5"/>
  <circle cx="250" cy="150" r="7" fill="url(#dotYellow)" opacity="0.6"/>
  <circle cx="340" cy="120" r="6" fill="url(#dotOrange)" opacity="0.55"/>
  <circle cx="440" cy="160" r="5" fill="url(#dotYellow)" opacity="0.5"/>
  <circle cx="500" cy="230" r="6.5" fill="url(#dotOrange)" opacity="0.6"/>
  <circle cx="520" cy="300" r="5" fill="url(#dotYellow)" opacity="0.55"/>

  <!-- 内层核心光点（亮橙，大，高透明度）- 形成"S"形旋涡 -->
  <!-- S形上弧 -->
  <circle cx="400" cy="200" r="10" fill="url(#dotOrange)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="430" cy="185" r="8" fill="url(#dotOrange)" opacity="0.9"/>
  <circle cx="460" cy="195" r="11" fill="url(#dotOrange)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="480" cy="220" r="9" fill="url(#dotYellow)" opacity="0.9"/>
  <circle cx="490" cy="255" r="12" fill="url(#dotOrange)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="475" cy="290" r="10" fill="url(#dotOrange)" opacity="0.9"/>
  <circle cx="450" cy="310" r="8" fill="url(#dotYellow)" opacity="0.85"/>
  
  <!-- S形中间交叉 -->
  <circle cx="420" cy="310" r="14" fill="url(#dotOrange)" opacity="0.95" filter="url(#glowStrong)"/>
  <circle cx="390" cy="290" r="11" fill="url(#dotOrange)" opacity="0.9"/>
  <circle cx="370" cy="265" r="9" fill="url(#dotYellow)" opacity="0.85"/>
  <circle cx="360" cy="235" r="7" fill="url(#dotYellow)" opacity="0.8"/>
  
  <!-- S形下弧 -->
  <circle cx="380" cy="330" r="10" fill="url(#dotOrange)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="355" cy="350" r="12" fill="url(#dotOrange)" opacity="0.9"/>
  <circle cx="320" cy="360" r="14" fill="url(#dotOrange)" opacity="0.85" filter="url(#glowStrong)"/>
  <circle cx="280" cy="350" r="11" fill="url(#dotYellow)" opacity="0.9"/>
  <circle cx="250" cy="330" r="9" fill="url(#dotOrange)" opacity="0.85"/>
  <circle cx="230" cy="300" r="7" fill="url(#dotYellow)" opacity="0.8"/>
  <circle cx="215" cy="270" r="5" fill="url(#dotYellow)" opacity="0.75"/>

  <!-- 核心高亮区 - 最中心光点 -->
  <circle cx="420" cy="310" r="5" fill="#FFFFFF" opacity="0.9" filter="url(#glowStrong)"/>
  <circle cx="415" cy="305" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- 光点拖尾效果 - 运动轨迹 -->
  <ellipse cx="500" cy="190" rx="15" ry="4" fill="#FF6B00" opacity="0.2" transform="rotate(-30 500 190)"/>
  <ellipse cx="460" cy="350" rx="18" ry="5" fill="#FF6B00" opacity="0.2" transform="rotate(20 460 350)"/>
  <ellipse cx="200" cy="280" rx="20" ry="5" fill="#FFB800" opacity="0.15" transform="rotate(-15 200 280)"/>

  <!-- ===== "星发" 文字 ===== -->
  <text x="380" y="460" font-family="'STKaiti','KaiTi','SimSun','Microsoft YaHei',serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="12" filter="url(#glow)">
    <tspan x="380" y="460">星</tspan>
    <tspan x="470" y="460">发</tspan>
  </text>

  <!-- 文字底部光点装饰 -->
  <circle cx="365" cy="480" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="395" cy="485" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="455" cy="482" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="485" cy="488" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="520" cy="475" r="3" fill="#FF6B00" opacity="0.3"/>

  <!-- 副标题/装饰线 -->
  <line x1="300" y1="500" x2="500" y2="500" stroke="#FF6B00" stroke-width="1" opacity="0.3"/>
  <circle cx="295" cy="500" r="2" fill="#FFD700" opacity="0.4"/>
  <circle cx="505" cy="500" r="2" fill="#FFD700" opacity="0.4"/>

  <!-- 底部极淡光点 - 延续燎原感 -->
  <circle cx="100" cy="540" r="1.5" fill="#FFF5E0" opacity="0.15"/>
  <circle cx="300" cy="560" r="2" fill="#FFF5E0" opacity="0.12"/>
  <circle cx="550" cy="555" r="1.5" fill="#FFF5E0" opacity="0.15"/>
  <circle cx="700" cy="540" r="2" fill="#FFF5E0" opacity="0.1"/>
  <circle cx="200" cy="570" r="1" fill="#FFF5E0" opacity="0.1"/>
  <circle cx="650" cy="565" r="1.5" fill="#FFF5E0" opacity="0.12"/>
</svg>